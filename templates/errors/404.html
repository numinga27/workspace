<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница не найдена</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f7fb 0%, #eef0ff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #0d0d12;
        }
        .container { max-width: 560px; text-align: center; }
        .icon-wrap {
            width: 120px; height: 120px;
            margin: 0 auto 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 20px 40px rgba(245, 158, 11, 0.3);
        }
        .icon-wrap svg { width: 60px; height: 60px; fill: white; }
        h1 { font-size: 28px; font-weight: 800; margin-bottom: 12px; }
        .subtitle { font-size: 16px; color: #52525b; margin-bottom: 32px; line-height: 1.6; }
        .btn {
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            background: #5b5bd6;
            color: white;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(91, 91, 214, 0.3);
            transition: all 0.2s ease;
        }
        .btn:hover { background: #4a4ac4; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-wrap">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M11 15h2v2h-2zm0-8h2v6h-2zm.99-5C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z"/>
            </svg>
        </div>
        <h1>Страница не найдена</h1>
        <p class="subtitle">
            Возможно, ссылка устарела или была удалена.
            Вернитесь на главную и попробуйте снова.
        </p>
        <a href="/dashboard" class="btn">
            🏠 На главную
        </a>
    </div>
</body>
</html>
