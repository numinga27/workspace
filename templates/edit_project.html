{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h4 class="mb-0"><i class="bi bi-pencil"></i> Редактирование проекта</h4>
                <a href="{{ url_for('view_project', project_id=project.id) }}" class="btn btn-sm btn-light">
                    <i class="bi bi-x"></i>
                </a>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Название *</label>
                        <input type="text" name="name" class="form-control" value="{{ project.name }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Описание</label>
                        <textarea name="description" class="form-control" rows="3">{{ project.description or '' }}</textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Заказчик</label>
                            <select name="customer_id" class="form-select">
                                <option value="">— Без заказчика —</option>
                                {% for c in customers %}
                                <option value="{{ c.id }}" {% if project.customer_id == c.id %}selected{% endif %}>
                                    {{ c.name }}{% if c.inn %} (ИНН: {{ c.inn }}){% endif %}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Статус</label>
                            <select name="status" class="form-select">
                                <option value="active" {% if project.status == 'active' %}selected{% endif %}>В работе</option>
                                <option value="paused" {% if project.status == 'paused' %}selected{% endif %}>Приостановлен</option>
                                <option value="completed" {% if project.status == 'completed' %}selected{% endif %}>Завершён</option>
                                <option value="cancelled" {% if project.status == 'cancelled' %}selected{% endif %}>Отменён</option>
                            </select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Дата старта</label>
                            <input type="date" name="start_date" class="form-control"
                                   value="{{ project.start_date.strftime('%Y-%m-%d') if project.start_date else '' }}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Дата окончания (план)</label>
                            <input type="date" name="end_date" class="form-control"
                                   value="{{ project.end_date.strftime('%Y-%m-%d') if project.end_date else '' }}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Создан</label>
                            <input type="text" class="form-control" disabled
                                   value="{{ project.created_at.strftime('%d.%m.%Y %H:%M') }}">
                            <small class="text-muted">Дата создания не меняется</small>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Сохранить</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
